{% load i18n %}
{% load app_tags %}

{% if rows %}
  <div class="mt-4 overflow-hidden rounded-md border border-[var(--color-border)]">
    <table class="w-full text-left text-sm">
      <thead class="bg-[var(--color-surface-strong)] text-[var(--color-text-muted)]">
        <tr>
          <th class="px-4 py-3">{% translate "Value" %}</th>
          <th class="px-4 py-3">{% translate "Count" %}</th>
          <th class="px-4 py-3">{% translate "Spent" %}</th>
        </tr>
      </thead>
      <tbody>
        {% for row in rows %}
          <tr class="border-t border-[var(--color-border)] first:border-t-0">
            <td class="px-4 py-3 text-[var(--color-text)]">{{ row.label }}</td>
            <td class="px-4 py-3 text-[var(--color-text-secondary)]">{{ row.count }}</td>
            <td class="px-4 py-3 text-[var(--color-text-secondary)]">{{ row.spent|collection_price }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% else %}
  <p class="mt-3 text-sm text-[var(--color-text-muted)]">{% translate "No collection data yet." %}</p>
{% endif %}
